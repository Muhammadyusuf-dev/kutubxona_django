{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>The Library - Bosh Sahifa</title>
    <style>
        body { background-color: #000; color: #ccc; font-family: 'Times New Roman', Times, serif; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-image: radial-gradient(circle, #1a1a1a 0%, #000 100%); }
        .header-container { text-align: center; margin-bottom: 30px; position: relative; }
        .puppet-art { width: 300px; margin-bottom: -20px; filter: drop-shadow(0px 5px 10px rgba(0, 0, 0, 0.8)); z-index: 2; position: relative; }
        h1 { color: #fff; font-size: 4em; margin: 0; text-transform: uppercase; letter-spacing: 5px; text-shadow: 2px 2px 5px #000; position: relative; z-index: 1; }
        h1 span { color: #8b0000; }
        .menu-container { display: flex; flex-direction: column; gap: 15px; width: 350px; }
        .menu-btn { display: block; text-align: center; padding: 15px 20px; background-color: #111; color: #c9a343; text-decoration: none; font-size: 1.2em; border: 1px solid #333; border-left: 4px solid #8b0000; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 4px 10px rgba(0,0,0,0.8); }
        .menu-btn:hover { background-color: #222; border-left: 4px solid #c9a343; color: #fff; transform: scale(1.05); }
        .quote { margin-top: 50px; font-style: italic; color: #666; font-size: 1.2em; border-top: 1px solid #333; padding-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="header-container">
        <img src="{% static 'godfather.png' %}" alt="Puppet Hand" class="puppet-art">
        <h1>THE <span>LIBRARY</span></h1>
    </div>
    <div class="menu-container">
        <a href="/kitoblar/" class="menu-btn">Barcha Kitoblar</a>
        <a href="/mualliflar/" class="menu-btn">Barcha Mualliflar</a>
        <a href="/recordlar/" class="menu-btn">Operatsiyalar (Recordlar)</a>
        <a href="/talabalar/" class="menu-btn">Talabalar Ro'yxati</a>
        <a href="/admin/" class="menu-btn" style="border-left-color: #444; color: #888; font-size: 0.9em;">Admin Panel</a>
    </div>
    <div class="quote">
        "Men unga rad etib bo'lmaydigan kitob taklif qilaman."<br>
        <span style="font-size: 0.8em; color: #444;">- Don Kutubxonachi</span>
    </div>
</body>
</html>
