<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Adminlar Ro'yxati</title>
    <style>
        body { background-color: #0d0d0d; color: #e0e0e0; font-family: 'Georgia', serif; margin: 0; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; background-color: #1a1a1a; padding: 30px; border: 1px solid #333; box-shadow: 0 0 20px rgba(0, 0, 0, 0.8); border-top: 4px solid #8b0000; position: relative; }
        h2 { color: #c9a343; font-family: 'Times New Roman', Times, serif; text-align: center; text-transform: uppercase; letter-spacing: 3px; border-bottom: 1px solid #333; padding-bottom: 15px; margin-top: 0; }
        .filter-container { background-color: #111; padding: 15px; border: 1px solid #c9a343; border-radius: 5px; margin-bottom: 25px; text-align: center; display: flex; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .add-btn { background-color: #222; color: #c9a343; border: 1px solid #c9a343; padding: 10px 20px; cursor: pointer; font-family: 'Georgia', serif; text-transform: uppercase; transition: 0.3s; font-weight: bold; width: 100%;}
        .add-btn:hover { background-color: #c9a343; color: #000; }
        .modal { display: none; position: fixed; z-index: 10; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.8); }
        .modal-content { background-color: #111; margin: 10% auto; padding: 30px; border: 2px solid #8b0000; width: 400px; border-radius: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.9); position: relative; }
        .close-btn { color: #c9a343; float: right; font-size: 28px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .close-btn:hover { color: #ff4d4d; }
        .modal h3 { color: #c9a343; margin-top: 0; border-bottom: 1px dotted #444; padding-bottom: 10px; font-family: 'Times New Roman', serif; text-transform: uppercase; text-align: center;}
        .modal-form label { display: block; margin-top: 15px; color: #999; font-style: italic; }
        .modal-form input, .modal-form select { width: 100%; padding: 10px; margin-top: 5px; background-color: #222; border: 1px solid #444; color: #c9a343; box-sizing: border-box; }
        .modal-form input:focus, .modal-form select:focus { outline: none; border-color: #8b0000; }
        .submit-btn { width: 100%; margin-top: 25px; padding: 12px; background-color: #8b0000; color: #fff; border: 1px solid #5a0000; cursor: pointer; text-transform: uppercase; font-family: 'Georgia', serif; transition: 0.3s; }
        .submit-btn:hover { background-color: #c9a343; color: #000; border-color: #c9a343; }
        ul { list-style-type: none; padding: 0; }
        li { background-color: #222; margin-bottom: 15px; padding: 20px; border-left: 3px solid #8b0000; transition: all 0.3s ease; }
        li:hover { background-color: #2a2a2a; border-left: 3px solid #c9a343; transform: translateX(5px); }
        .name { color: #c9a343; font-size: 1.3em; font-weight: bold; }
        .details { color: #999; font-size: 0.95em; margin-top: 8px; font-style: italic; }
        .back-btn { display: inline-block; margin-top: 20px; padding: 10px 20px; background-color: #8b0000; color: #fff; text-decoration: none; border: 1px solid #5a0000; transition: 0.3s; font-family: 'Georgia', serif; }
        .back-btn:hover { background-color: #c9a343; color: #000; border-color: #c9a343; }
    </style>
</head>
<body>

    <div id="addModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="yopishModal()">&times;</span>
            <h3>Yangi Admin Qo'shish</h3>
            <form action="" method="POST" class="modal-form">
                {% csrf_token %}
                <label>Admin ismi:</label>
                <input type="text" name="ism" required>
                <label>Ish vaqti:</label>
                <select name="ish_vaqti" required>
                    <option value="" disabled selected>-- Ish vaqtini tanlang --</option>
                    <option value="6">6 soat</option>
                    <option value="8">8 soat</option>
                    <option value="12">12 soat</option>
                    <option value="24">24 soat</option>
                </select>
                <button type="submit" class="submit-btn">Saqlash</button>
            </form>
        </div>
    </div>

    <div class="container">
        <h2>Adminlar Arvixi</h2>
        <div class="filter-container">
            <button type="button" class="add-btn" onclick="ochishModal()">+ Yangi Admin Qo'shish</button>
        </div>
        <ul>
            {% for admin in adminlar %}
                <li>
                    <div class="name">{{ admin.ism }}</div>
                    <div class="details">
                        Ish vaqti: {{ admin.ish_vaqti }} soat
                    </div>
                </li>
            {% empty %}
                <li style="text-align: center; border: none; color: #666;">Adminlar topilmadi.</li>
            {% endfor %}
        </ul>
        <div style="text-align: center;">
            <a href="/" class="back-btn">&#8592; Bosh sahifaga qaytish</a>
        </div>
    </div>

    <script>
        var modal = document.getElementById("addModal");
        function ochishModal() { modal.style.display = "block"; }
        function yopishModal() { modal.style.display = "none"; }
        window.onclick = function(event) { if (event.target == modal) { modal.style.display = "none"; } }
    </script>
</body>
</html>
