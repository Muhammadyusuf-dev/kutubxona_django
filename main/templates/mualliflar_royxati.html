<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Mualliflar Arvixi</title>
    <style>
        body { background-color: #0d0d0d; color: #e0e0e0; font-family: 'Georgia', serif; margin: 0; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; background-color: #1a1a1a; padding: 30px; border: 1px solid #333; box-shadow: 0 0 20px rgba(0, 0, 0, 0.8); border-top: 4px solid #8b0000; }
        h2 { color: #c9a343; font-family: 'Times New Roman', Times, serif; text-align: center; text-transform: uppercase; letter-spacing: 3px; border-bottom: 1px solid #333; padding-bottom: 15px; margin-top: 0; }
        .filter-container { background-color: #111; padding: 15px; border: 1px solid #c9a343; border-radius: 5px; margin-bottom: 25px; text-align: center; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .filter-input { padding: 10px; background-color: #222; border: 1px solid #444; color: #c9a343; font-family: 'Times New Roman', serif; width: 60%; font-size: 1em; box-sizing: border-box; }
        .filter-input:focus { outline: none; border-color: #8b0000; }
        .filter-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 20px; background-color: #8b0000; color: #fff; border: 1px solid #5a0000; cursor: pointer; font-family: 'Georgia', serif; text-transform: uppercase; transition: 0.3s; }
        .filter-btn:hover { background-color: #c9a343; color: #000; border-color: #c9a343; }
        ul { list-style-type: none; padding: 0; }
        li { background-color: #222; margin-bottom: 15px; padding: 20px; border-left: 3px solid #8b0000; transition: all 0.3s ease; display: flex; justify-content: space-between; align-items: center; }
        li:hover { background-color: #2a2a2a; border-left: 3px solid #c9a343; transform: translateX(5px); }
        a.title-link { color: #c9a343; text-decoration: none; font-size: 1.3em; font-weight: bold; }
        a.title-link:hover { color: #fff; text-shadow: 0 0 5px rgba(201, 163, 67, 0.5); }
        .details { color: #999; font-size: 0.95em; margin-top: 8px; font-style: italic; }
        .delete-btn { color: #ff4d4d; text-decoration: none; font-size: 0.9em; border: 1px solid #ff4d4d; padding: 5px 10px; border-radius: 3px; transition: 0.3s; }
        .delete-btn:hover { background-color: #ff4d4d; color: #fff; }
        .back-btn { display: inline-block; margin-top: 20px; padding: 10px 20px; background-color: #8b0000; color: #fff; text-decoration: none; border: 1px solid #5a0000; transition: 0.3s; font-family: 'Georgia', serif; }
        .back-btn:hover { background-color: #c9a343; color: #000; border-color: #c9a343; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Mualliflar Arvixi</h2>
        <form action="" method="GET" class="filter-container">
            <input type="text" name="qidiruv" class="filter-input" placeholder="Muallif ismini kiriting..." value="{{ request.GET.qidiruv }}">
            <button type="submit" class="filter-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                Qidirish
            </button>
        </form>
        <ul>
            {% for muallif in mualliflar %}
                <li>
                    <div>
                        <a href="/muallif/{{ muallif.id }}" class="title-link">{{ muallif.ism }}</a>
                        <div class="details">
                            Tug'ilgan sanasi: {{ muallif.tugilgan_sana }} &nbsp;|&nbsp; Kitoblari: {{ muallif.kitob_soni }} ta
                        </div>
                    </div>
                    <a href="/muallif/{{ muallif.id }}/ochirish/" class="delete-btn">O'chirish</a>
                </li>
            {% empty %}
                <li style="text-align: center; border: none; color: #666; justify-content: center;">Mualliflar topilmadi.</li>
            {% endfor %}
        </ul>
        <div style="text-align: center;">
            <a href="/" class="back-btn">&#8592; Bosh sahifaga qaytish</a>
        </div>
    </div>
</body>
</html>
